<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Menu — Chef's Special</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c9a84c;
      --gold-light: #e8c97a;
      --dark: #0e0c0a;
      --dark-2: #1a1713;
      --dark-3: #252119;
      --cream: #f5eed8;
      --cream-dim: #c4b99a;
      --red: #c0392b;
    }

    html, body {
      height: 100%;
      background: var(--dark);
      color: var(--cream);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }

    /* ── Top bar ── */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: linear-gradient(180deg, rgba(14,12,10,0.98) 0%, rgba(14,12,10,0) 100%);
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: var(--gold);
      letter-spacing: 0.05em;
    }
    .badge {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--dark);
      background: var(--gold);
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* ── Model viewer ── */
    model-viewer {
      width: 100%;
      height: 100vh;
      background: radial-gradient(ellipse at 50% 50%, #2a2218 0%, #0e0c0a 70%);
      --poster-color: transparent;
      display: block;
      margin: 0 auto;
      object-fit: contain;
    }

    /* ── Overlay card at bottom ── */
    .card {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 100;
      padding: 24px 24px 36px;
      background: linear-gradient(0deg, rgba(14,12,10,0.98) 60%, rgba(14,12,10,0) 100%);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .dish-tag {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 500;
    }
    .dish-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.85rem;
      line-height: 1.15;
      color: var(--cream);
    }
    .dish-desc {
      font-size: 0.82rem;
      color: var(--cream-dim);
      line-height: 1.6;
      margin-top: 2px;
      max-width: 320px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      gap: 12px;
    }
    .price {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: var(--gold-light);
    }
    .price span {
      font-size: 0.8rem;
      font-family: 'DM Sans', sans-serif;
      color: var(--cream-dim);
      margin-left: 2px;
    }

    /* AR button */
    .ar-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--gold);
      color: var(--dark);
      border: none;
      border-radius: 50px;
      padding: 12px 22px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: background 0.2s, transform 0.15s;
      text-decoration: none;
    }
    .ar-btn:active { transform: scale(0.97); }
    .ar-btn:hover { background: var(--gold-light); }
    .ar-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* Tags */
    .tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .tag {
      font-size: 0.68rem;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(201,168,76,0.3);
      color: var(--cream-dim);
      letter-spacing: 0.05em;
    }

    /* ── Pulse ring on AR icon ── */
    .ar-icon-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ar-icon-wrap::before {
      content: '';
      position: absolute;
      width: 24px; height: 24px;
      border-radius: 50%;
      background: rgba(201,168,76,0.3);
      animation: pulse 1.8s ease-out infinite;
    }
    @keyframes pulse {
      0%   { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    /* ── Loading overlay ── */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.5s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .loading-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      color: var(--gold);
    }
    .loading-bar-wrap {
      width: 160px;
      height: 2px;
      background: var(--dark-3);
      border-radius: 2px;
      overflow: hidden;
    }
    .loading-bar {
      height: 100%;
      background: var(--gold);
      border-radius: 2px;
      animation: load 1.6s ease forwards;
    }
    @keyframes load {
      from { width: 0%; }
      to   { width: 100%; }
    }
    .loading-hint {
      font-size: 0.72rem;
      color: var(--cream-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ── Decorative grain overlay ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 300;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      background-size: 200px;
    }

    /* hide default AR button from model-viewer */
    model-viewer::part(default-ar-button) { display: none; }

    /* progress bar style */
    model-viewer::part(default-progress-bar) {
      background: var(--gold);
      height: 2px;
    }
  </style>
</head>
<body>

  <!-- Loading screen -->
  <div id="loading">
    <div class="loading-logo">Savoria</div>
    <div class="loading-bar-wrap"><div class="loading-bar"></div></div>
    <div class="loading-hint">Preparing your dish…</div>
  </div>

  <!-- Top bar -->
  <div class="topbar">
    <div class="logo">Savoria</div>
    <div class="badge">AR Menu</div>
  </div>

  <!-- 3D Model Viewer -->
  <!--
    FREE MODEL SOURCE: https://poly.pizza/m/burger or https://sketchfab.com
    Replace the src below with your own .glb file path after downloading.
    Example free burger model from Google's model-viewer samples:
  -->
  <model-viewer
    id="viewer"
    src="Cheeseburger.glb"
    alt="Chef's Special Cheeseburger in 3D"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="wall"
    ar-scale="auto"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    auto-rotate-delay="500"
    rotation-per-second="20deg"
    shadow-intensity="0.6"
    shadow-softness="1"
    exposure="0.9"
    environment-image="neutral"
    interaction-prompt="auto"
    camera-orbit="0deg 75deg 2.5m"
    field-of-view="30deg"
  ></model-viewer>

  <!-- Bottom info card -->
  <div class="card">
    <div class="dish-tag">Chef's Special · Today Only</div>
    <div class="dish-name">Classic Smash Burger</div>
    <div class="dish-desc">Double smashed patty, aged cheddar, caramelised onions, house pickles & secret sauce on a brioche bun.</div>
    <div class="tags">
      <div class="tag">🔥 Bestseller</div>
      <div class="tag">🧀 Contains Dairy</div>
      <div class="tag">⏱ 12 min</div>
    </div>
    <div class="row">
      <div class="price">₹349 <span>incl. taxes</span></div>
      <a class="ar-btn" id="arTrigger" href="#">
        <div class="ar-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"/>
            <path d="m22 22-4-4m0 0a5 5 0 1 0-7.07-7.07A5 5 0 0 0 18 18z"/>
          </svg>
        </div>
        View in AR
      </a>
    </div>
  </div>

  <!-- Fallback toast -->
  <div id="toast" style="
    display:none; position:fixed; bottom:160px; left:50%; transform:translateX(-50%);
    background:#1a1713; border:1px solid #c9a84c; color:#f5eed8;
    padding:12px 20px; border-radius:12px; font-size:0.8rem; z-index:999;
    text-align:center; max-width:280px; line-height:1.5;
  "></div>

  <script>
    window.addEventListener('load', () => {
      setTimeout(() => document.getElementById('loading').classList.add('hidden'), 1800);
    });

    const viewer = document.getElementById('viewer');
    const arBtn  = document.getElementById('arTrigger');
    const toast  = document.getElementById('toast');

    function showToast(msg, ms = 5000) {
      toast.innerHTML = msg;
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', ms);
    }

    const ua        = navigator.userAgent;
    const isIOS     = /iphone|ipad|ipod/i.test(ua);
    const isAndroid = /android/i.test(ua);

    arBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (viewer.canActivateAR) {
        viewer.activateAR();
      } else if (isIOS) {
        showToast('📱 Open this page in <strong>Safari</strong> on iPhone/iPad for AR.');
      } else if (isAndroid) {
        showToast('📱 Open this page in <strong>Chrome</strong> on Android for AR.');
      } else {
        showToast('📱 AR works on mobile only — scan the QR with your phone!');
      }
    });

    viewer.addEventListener('ar-status', (e) => {
      if (e.detail.status === 'failed') {
        if (isIOS) {
          showToast('AR failed. Use <strong>Safari</strong> and allow camera access.');
        } else if (isAndroid) {
          showToast('AR failed. Install <strong>Google Play Services for AR</strong> and use Chrome.');
        } else {
          showToast('AR not supported — you can still spin & zoom the 3D model!');
        }
      }
    });
  </script>
</body>
</html>
